<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>教材巡迴展 - 老師專屬闖關集點卡</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti Library for completion celebration -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Zen+Maru+Gothic:wght@500;700;900&display=swap');

        :root {
            --planet-yellow: #FFF3A7;
            --planet-purple: #DCD6F7;
            --planet-blue: #A6E3E9;
            --primary-accent: #7B61FF;
            --secondary-accent: #FF6B8B;
            --gold-accent: #FFB800;
            --bg-grad: linear-gradient(180deg, #E6F4FE 0%, #F5F0FF 50%, #FFF5FB 100%);
            --card-bg: rgba(255, 255, 255, 0.94);
            --text-main: #344054;
            --text-sub: #667085;
            --border-radius: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Zen Maru Gothic', 'Fredoka', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg-grad);
            color: var(--text-main);
            padding-bottom: 60px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* 繪本星球插圖主題背景 */
        .planet-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -46%);
            width: 100%;
            max-width: 680px;
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
            filter: drop-shadow(0 15px 30px rgba(123, 97, 255, 0.25));
            animation: floatPlanet 14s ease-in-out infinite alternate;
        }

        @keyframes floatPlanet {
            0% { transform: translate(-50%, -46%) rotate(0deg) scale(1); }
            50% { transform: translate(-50%, -48%) rotate(2.5deg) scale(1.03); }
            100% { transform: translate(-50%, -44%) rotate(-2deg) scale(0.98); }
        }

        /* 背景可愛漂浮裝飾雲朵 */
        .bg-decor {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.75);
            border-radius: 50px;
            filter: blur(1px);
            animation: float 8s ease-in-out infinite alternate;
        }

        .cloud-1 { width: 140px; height: 45px; top: 40px; left: -20px; }
        .cloud-2 { width: 180px; height: 55px; top: 120px; right: -30px; animation-delay: -3s; }
        .cloud-3 { width: 120px; height: 40px; top: 350px; left: -10px; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px); }
            100% { transform: translateY(12px) translateX(10px); }
        }

        header {
            background: linear-gradient(135deg, #8A7CFB 0%, #A294FF 40%, #E29BF7 100%);
            color: white;
            padding: 34px 20px 52px;
            text-align: center;
            border-bottom-left-radius: 38px;
            border-bottom-right-radius: 38px;
            box-shadow: 0 12px 28px rgba(138, 124, 251, 0.28);
            position: relative;
            z-index: 1;
        }

        .header-title-container {
            display: inline-block;
            position: relative;
        }

        header h1 {
            font-size: 1.6rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(90, 60, 160, 0.3);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header p {
            font-size: 0.92rem;
            opacity: 0.98;
            background: rgba(255, 255, 255, 0.22);
            display: inline-block;
            padding: 5px 18px;
            border-radius: 20px;
            backdrop-filter: blur(6px);
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 0 18px;
            position: relative;
            z-index: 1;
        }

        /* 進度卡片 */
        .progress-card {
            background: var(--card-bg);
            margin-top: -32px;
            border-radius: var(--border-radius);
            padding: 20px 22px;
            box-shadow: 0 14px 32px rgba(123, 97, 255, 0.14);
            border: 3px solid #FFFFFF;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
        }

        .progress-info {
            flex-grow: 1;
            margin-right: 16px;
        }

        .progress-title-wrap {
            display: flex;
            justify-content: space-between;
            font-size: 0.95rem;
            font-weight: 900;
            color: #4A3E7D;
            margin-bottom: 8px;
        }

        .progress-bar-bg {
            background: #EFE8FF;
            height: 16px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.06);
            padding: 2px;
        }

        .progress-bar-fill {
            background: linear-gradient(90deg, #70E2D2 0%, #7B61FF 50%, #FF6B8B 100%);
            height: 100%;
            width: 0%;
            border-radius: 10px;
            transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .redeem-btn {
            background: #E0E0E0;
            color: #999;
            border: none;
            padding: 12px 20px;
            border-radius: 28px;
            font-weight: 900;
            font-size: 0.9rem;
            cursor: not-allowed;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 0px #CCCCCC;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .redeem-btn.active {
            background: linear-gradient(135deg, #FFB800 0%, #FF8A00 100%);
            color: white;
            cursor: pointer;
            box-shadow: 0 5px 0px #D67300, 0 8px 18px rgba(255, 138, 0, 0.45);
            animation: bounce 1.2s infinite alternate;
        }

        .redeem-btn.active:hover {
            transform: translateY(-2px);
        }

        .redeem-btn.redeemed {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 0px #1B5E20;
            animation: none;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-5px); }
        }

        .section-title {
            font-size: 1.2rem;
            margin: 26px 0 16px;
            font-weight: 900;
            color: #3E3068;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '🧩';
            font-size: 1.25rem;
        }

        /* 3x3 拼圖容器與拼圖塊樣式 */
        .puzzle-board-wrapper {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 16px;
            border-radius: 28px;
            box-shadow: 0 12px 35px rgba(123, 97, 255, 0.15);
            border: 4px solid #FFFFFF;
        }

        .puzzle-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 20px;
            overflow: hidden;
            background: #251B4E;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
            position: relative;
        }

        .puzzle-tile {
            position: relative;
            cursor: pointer;
            overflow: hidden;
            border-radius: 10px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.15);
        }

        .puzzle-tile:hover {
            transform: scale(0.97);
            z-index: 10;
        }

        .puzzle-tile:active {
            transform: scale(0.93);
        }

        /* 未完成時的星球剪影風格背景 */
        .tile-locked {
            background: radial-gradient(circle at 50% 50%, #433276 0%, #201742 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px;
            text-align: center;
            border: 2px dashed rgba(255, 255, 255, 0.25);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.4);
        }

        /* 未開鎖時顯示剪影與關卡名 */
        .tile-silhouette-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-size: 300% 300%;
            opacity: 0.18;
            filter: grayscale(100%) brightness(0.6);
            pointer-events: none;
        }

        .tile-locked-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            gap: 4px;
        }

        .tile-title {
            font-size: 0.78rem;
            font-weight: 900;
            color: #E2D9F7;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
            background: rgba(0, 0, 0, 0.45);
            padding: 2px 8px;
            border-radius: 12px;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .tile-lock-icon {
            font-size: 1.4rem;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.75; }
            100% { transform: scale(1.15); opacity: 1; }
        }

        /* 集章完成拼圖塊：拼接完整大圖背景 */
        .tile-unlocked {
            position: relative;
            animation: tileFlip 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.25) forwards;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.2);
        }

        @keyframes tileFlip {
            0% { transform: scale(0.7) rotateY(90deg); opacity: 0; }
            100% { transform: scale(1) rotateY(0deg); opacity: 1; }
        }

        /* 拼圖背景圖片拼接定位 (3x3 矩陣計算) */
        .tile-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('HESSpuzzle.png');
            background-size: 300% 300%;
            filter: brightness(1.02) contrast(1.02);
            transition: transform 0.4s ease;
        }

        .puzzle-tile:hover .tile-img {
            transform: scale(1.04);
        }

        /* 彈窗樣式 */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(45, 35, 80, 0.6);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #FFFFFF;
            border-radius: 30px;
            padding: 30px 26px;
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-shadow: 0 22px 45px rgba(45, 35, 80, 0.28);
            transform: translateY(30px) scale(0.94);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 4px solid #F0EBFF;
            position: relative;
        }

        .modal-overlay.active .modal {
            transform: translateY(0) scale(1);
        }

        .modal-icon {
            font-size: 2.8rem;
            margin-bottom: 8px;
            display: inline-block;
        }

        .modal h2 {
            font-size: 1.3rem;
            font-weight: 900;
            color: #332463;
            margin-bottom: 6px;
        }

        .modal p {
            font-size: 0.88rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            line-height: 1.45;
            font-weight: 600;
        }

        .password-input {
            width: 100%;
            padding: 14px;
            font-size: 1.5rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: 6px;
            border: 2.5px solid #D8CEF6;
            border-radius: 18px;
            margin-bottom: 20px;
            outline: none;
            background: #FAF8FF;
            color: #7B61FF;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .password-input:focus {
            border-color: #7B61FF;
            background: #FFF;
            box-shadow: 0 0 0 4px rgba(123, 97, 255, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 20px;
            font-weight: 900;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #8A7CFB 0%, #7B61FF 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(123, 97, 255, 0.38);
        }

        .btn-secondary {
            background: #F0EDF9;
            color: #615293;
        }

        .btn-danger {
            background: linear-gradient(135deg, #FF6B8B 0%, #FF5277 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(255, 82, 119, 0.38);
        }

        .btn-success {
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            color: white;
            box-shadow: 0 4px 14px rgba(46, 125, 50, 0.38);
        }

        /* 兌獎憑證區 */
        .gift-voucher {
            background: linear-gradient(135deg, #FFF6E5 0%, #FFEFCF 100%);
            border: 2.5px dashed #FFB800;
            border-radius: 22px;
            padding: 18px;
            margin: 0 auto 20px;
            position: relative;
            overflow: hidden;
        }

        .gift-voucher-code {
            font-size: 1.25rem;
            font-weight: 900;
            color: #D67300;
            letter-spacing: 2px;
            margin-top: 6px;
        }

        .redeemed-badge {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-15deg);
            border: 3px double #2E7D32;
            color: #2E7D32;
            background: rgba(255, 255, 255, 0.94);
            padding: 6px 18px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 1.15rem;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
            pointer-events: none;
            z-index: 10;
        }

        .gift-voucher.is-redeemed .redeemed-badge {
            display: block;
        }

        .reset-link {
            display: block;
            margin-top: 30px;
            text-align: center;
            font-size: 0.8rem;
            color: #9C8EB9;
            text-decoration: underline;
            cursor: pointer;
            font-weight: 700;
            transition: color 0.2s;
        }

        .reset-link:hover {
            color: #7B61FF;
        }

        /* Toast 訊息 */
        .toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: #FF5277;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 0.9rem;
            font-weight: 900;
            box-shadow: 0 8px 22px rgba(255, 82, 119, 0.38);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.3);
            z-index: 200;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <!-- 主題繪本星球背景底圖 -->
    <svg class="planet-bg" viewBox="0 0 700 700" xmlns="http://www.w3.org/2000/svg">
        <defs>
            <radialGradient id="planetBodyGrad" cx="42%" cy="38%" r="58%">
                <stop offset="0%" stop-color="#FFF9C4"/>
                <stop offset="35%" stop-color="#F5B4F8"/>
                <stop offset="70%" stop-color="#9A75FA"/>
                <stop offset="100%" stop-color="#5B45C6"/>
            </radialGradient>

            <linearGradient id="ringGradFront" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE57F" stop-opacity="0.95"/>
                <stop offset="50%" stop-color="#FF80AB" stop-opacity="0.85"/>
                <stop offset="100%" stop-color="#B388FF" stop-opacity="0.95"/>
            </linearGradient>

            <linearGradient id="ringGradBack" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#FFE57F" stop-opacity="0.4"/>
                <stop offset="100%" stop-color="#7C4DFF" stop-opacity="0.4"/>
            </linearGradient>

            <filter id="softGlow">
                <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>

        <g fill="#FFF" opacity="0.6">
            <circle cx="100" cy="180" r="4" />
            <circle cx="600" cy="220" r="5" />
            <circle cx="140" cy="520" r="6" />
            <circle cx="580" cy="480" r="4" />
        </g>

        <g transform="rotate(-18 350 350)">
            <ellipse cx="350" cy="350" rx="310" ry="75" fill="none" stroke="url(#ringGradBack)" stroke-width="22" opacity="0.5"/>
            <ellipse cx="350" cy="350" rx="275" ry="60" fill="none" stroke="#FFFFFF" stroke-width="6" opacity="0.4"/>
        </g>

        <circle cx="350" cy="350" r="215" fill="url(#planetBodyGrad)" filter="url(#softGlow)" />

        <g opacity="0.28" fill="#5239A0">
            <circle cx="270" cy="260" r="32" />
            <circle cx="260" cy="252" r="26" fill="#FFF" opacity="0.15" />
            <circle cx="380" cy="220" r="20" />
            <circle cx="430" cy="390" r="45" />
            <circle cx="418" cy="380" r="36" fill="#FFF" opacity="0.15" />
            <circle cx="230" cy="420" r="25" />
        </g>

        <path d="M 200 210 A 200 200 0 0 1 450 180" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" opacity="0.4" />

        <g transform="rotate(-18 350 350)">
            <path d="M 40 350 A 310 75 0 0 0 660 350" fill="none" stroke="url(#ringGradFront)" stroke-width="22" stroke-linecap="round" />
            <path d="M 75 350 A 275 60 0 0 0 625 350" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" opacity="0.9" />
        </g>
    </svg>

    <!-- 背景裝飾雲朵 -->
    <div class="bg-decor">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
    </div>

    <header>
        <div class="header-title-container">
            <h1>2026 全新領域教材展示會</h1>
            <p>解鎖 3×3 星球拼圖 • 集滿 9 關領好禮</p>
        </div>
    </header>

    <div class="container">
        <!-- 進度條 -->
        <div class="progress-card">
            <div class="progress-info">
                <div class="progress-title-wrap">
                    <span>🚀 拼圖解鎖進度</span>
                    <span id="progress-text">0 / 9</span>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
            </div>
            <button class="redeem-btn" id="redeem-btn" onclick="openRedeemModal()">
                🎁 兌換好禮
            </button>
        </div>

        <!-- 3x3 拼圖區域 -->
        <div class="section-title">星球探索拼圖集章區</div>
        <div class="puzzle-board-wrapper">
            <div class="puzzle-grid" id="puzzle-grid"></div>
        </div>

        <span class="reset-link" onclick="openResetModal()">⚙️ 重置集點紀錄（僅供測試）</span>
    </div>

    <!-- 密碼輸入彈窗 -->
    <div class="modal-overlay" id="pw-modal">
        <div class="modal">
            <div class="modal-icon" id="pw-modal-icon">🗝️</div>
            <h2 id="pw-modal-title">關卡驗證</h2>
            <p id="pw-modal-desc">請由現場關主工作人員輸入密碼完成蓋章：</p>
            <input type="password" id="pw-input" class="password-input" placeholder="***" autocomplete="off" pattern="[0-9]*" inputmode="numeric">
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closePwModal()">取消</button>
                <button class="btn btn-primary" onclick="verifyPassword()">確認蓋章</button>
            </div>
        </div>
    </div>

    <!-- 兌獎彈窗 -->
    <div class="modal-overlay" id="redeem-modal">
        <div class="modal">
            <div class="modal-icon" id="redeem-modal-icon">🎉</div>
            <h2 id="redeem-modal-title">恭喜完成全區體驗！</h2>
            <p id="redeem-modal-desc">請向服務台出示此兌換卡領取精美好禮！</p>
            <div class="gift-voucher" id="gift-voucher">
                <div style="font-size: 0.8rem; color: #B36B00; font-weight: 700;">VIP 專屬選書贈禮憑證</div>
                <div class="gift-voucher-code">#2026-TEACHER-888</div>
                <div class="redeemed-badge">✓ 已完成兌換</div>
            </div>
            <div class="btn-group" style="flex-direction: column; gap: 10px;">
                <button class="btn btn-success" id="staff-redeem-btn" onclick="openStaffRedeemAuth()">🎁 工作人員核銷兌換</button>
                <button class="btn btn-secondary" style="width: 100%;" onclick="closeRedeemModal()">關閉視窗</button>
            </div>
        </div>
    </div>

    <!-- 重置確認彈窗 -->
    <div class="modal-overlay" id="reset-modal">
        <div class="modal">
            <div class="modal-icon">🧹</div>
            <h2>確定要重置進度嗎？</h2>
            <p>重置後將清空目前所有已獲得的星球章與兌換紀錄。</p>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeResetModal()">取消</button>
                <button class="btn btn-danger" onclick="confirmResetStamps()">確定重置</button>
            </div>
        </div>
    </div>

    <!-- Toast 訊息提示 -->
    <div class="toast" id="toast-msg">❌ 密碼錯誤，請重新詢問現場工作人員！</div>

    <script>
        // Web Audio API 音效
        const AudioFX = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
            },
            playStamp() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(680, now + 0.12);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.2);
            },
            playError() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(180, now);
                osc.frequency.setValueAtTime(120, now + 0.1);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.25);
            },
            playVictory() {
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const notes = [261.63, 329.63, 392.00, 523.25];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.15, now + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.3);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(now + idx * 0.1);
                    osc.stop(now + idx * 0.1 + 0.3);
                });
            }
        };

        // 9 個關卡資料
        const zones = [
            { title: "數位研究室", desc: "數位新品、AI工具分享", pw: "101", icon: "star" },
            { title: "教學補給站", desc: "教具展示", pw: "102", icon: "book" },
            { title: "繪本星球", desc: "Wow Story與Wow Story Phonics", pw: "201", icon: "sparkle" },
            { title: "素養星球", desc: "Super Fun", pw: "202", icon: "crown" },
            { title: "生活星球", desc: "Fun World", pw: "301", icon: "clover" },
            { title: "節慶小屋", desc: "實體Padlet+主題骰子", pw: "302", icon: "heart" },
            { title: "星際摩天輪", desc: "實體&數位字母轉盤", pw: "401", icon: "gift" },
            { title: "太空小幫手", desc: "學力檢測+Padlet Arcade", pw: "402", icon: "sun" },
            { title: "Hess小舖", desc: "點心兌換", pw: "501", icon: "gift" }
        ];

        // 印章 SVG 圖示
        const stampIcons = {
            star: `<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`,
            book: `<svg viewBox="0 0 24 24"><path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/></svg>`,
            sparkle: `<svg viewBox="0 0 24 24"><path d="M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5z"/></svg>`,
            crown: `<svg viewBox="0 0 24 24"><path d="M5 16L3 5l5.5 5L12 4l3.5 6L21 5l-2 11H5zm14 3c0 .6-.4 1-1 1H6c-.6 0-1-.4-1-1v-1h14v1z"/></svg>`,
            clover: `<svg viewBox="0 0 24 24"><path d="M12 10a3 3 0 0 0-3-3 3 3 0 0 0 3 3h3v-3zm0 0a3 3 0 0 0 3-3 3 3 0 0 0 3 3 3 3 0 0 0-3 3h-3v-3zm0 0a3 3 0 0 0-3 3 3 3 0 0 0-3 3 3 3 0 0 0 3-3v-3zm0 0a3 3 0 0 0 3 3 3 3 0 0 0 3-3 3 3 0 0 0-3-3v3z"/></svg>`,
            heart: `<svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>`,
            gift: `<svg viewBox="0 0 24 24"><path d="M20 6h-3.17c.42-.62.67-1.37.67-2.2C17.5 2.1 16.1 1 14.5 1c-1.3 0-2.4.84-2.82 2h-.36C10.9 1.84 9.8 1 8.5 1 6.9 1 5.5 2.1 5.5 3.8c0 .83.25 1.58.67 2.2H3c-1.1 0-2 .9-2 2v3c0 .55.45 1 1 1h1v8c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-8h1c.55 0 1-.45 1-1V8c0-1.1-.9-2-2-2z"/></svg>`,
            sun: `<svg viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-5zm0 8c-1.65 0-3-1.35-3-3s1.35-3 3-3 3 1.35 3 3-1.35 3-3 3zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>`
        };

        // 狀態管理
        let currentSelectIndex = null;
        let isStaffRedeemMode = false;
        let stampedState = JSON.parse(localStorage.getItem('teacher_stamp_state')) || new Array(zones.length).fill(false);
        let isRedeemed = JSON.parse(localStorage.getItem('teacher_prize_redeemed')) || false;

        const REDEEM_PASS = "PBD";

        if (stampedState.length !== zones.length) {
            stampedState = new Array(zones.length).fill(false);
        }

        // 計算 3x3 背景拼圖位移百分比
        function getBgPosition(index) {
            const row = Math.floor(index / 3);
            const col = index % 3;
            const posX = col * 50; // 0%, 50%, 100%
            const posY = row * 50; // 0%, 50%, 100%
            return `${posX}% ${posY}%`;
        }

        // 初始化渲染 3x3 拼圖網格
        function renderCards() {
            const grid = document.getElementById('puzzle-grid');
            grid.innerHTML = '';

            zones.forEach((zone, i) => {
                const tile = document.createElement('div');
                tile.onclick = () => openPwModal(i);

                const isStamped = stampedState[i];
                const bgPos = getBgPosition(i);

                if (isStamped) {
                    tile.className = 'puzzle-tile tile-unlocked';
                    tile.innerHTML = `
                        <div class="tile-img" style="background-position: ${bgPos};"></div>
                    `;
                } else {
                    tile.className = 'puzzle-tile tile-locked';
                    tile.innerHTML = `
                        <div class="tile-silhouette-bg" style="background-position: ${bgPos};"></div>
                        <div class="tile-locked-content">
                            <div class="tile-lock-icon">🪐</div>
                            <div class="tile-title">${zone.title}</div>
                        </div>
                    `;
                }

                grid.appendChild(tile);
            });

            updateUI();
        }

        // 開啟關卡蓋章密碼彈窗
        function openPwModal(index) {
            if (stampedState[index]) return;
            isStaffRedeemMode = false;
            currentSelectIndex = index;
            document.getElementById('pw-modal-icon').innerText = '🗝️';
            document.getElementById('pw-modal-title').innerText = `${zones[index].title}`;
            document.getElementById('pw-modal-desc').innerText = '請由現場關主工作人員輸入密碼解鎖拼圖：';
            document.getElementById('pw-input').value = '';
            document.getElementById('pw-modal').classList.add('active');
            setTimeout(() => document.getElementById('pw-input').focus(), 120);
        }

        // 工作人員核銷對換驗證
        function openStaffRedeemAuth() {
            if (isRedeemed) return;
            closeRedeemModal();
            isStaffRedeemMode = true;
            document.getElementById('pw-modal-icon').innerText = '🎁';
            document.getElementById('pw-modal-title').innerText = '工作人員核銷兌換';
            document.getElementById('pw-modal-desc').innerText = '請由服務台工作人員輸入核銷密碼：';
            document.getElementById('pw-input').value = '';
            document.getElementById('pw-modal').classList.add('active');
            setTimeout(() => document.getElementById('pw-input').focus(), 120);
        }

        function closePwModal() {
            document.getElementById('pw-modal').classList.remove('active');
            currentSelectIndex = null;
            isStaffRedeemMode = false;
        }

        function showToast(message) {
            const toast = document.getElementById('toast-msg');
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        function triggerConfetti() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 90,
                    spread: 80,
                    origin: { y: 0.6 }
                });
            }
        }

        function verifyPassword() {
            const inputPw = document.getElementById('pw-input').value.trim();

            if (isStaffRedeemMode) {
                if (inputPw.toUpperCase() === REDEEM_PASS) {
                    isRedeemed = true;
                    localStorage.setItem('teacher_prize_redeemed', JSON.stringify(true));
                    AudioFX.playVictory();
                    triggerConfetti();
                    closePwModal();
                    openRedeemModal();
                    updateUI();
                } else {
                    AudioFX.playError();
                    showToast("❌ 核銷密碼錯誤，請重新確認！");
                    document.getElementById('pw-input').value = '';
                }
            } else {
                const correctPw = zones[currentSelectIndex].pw;
                if (inputPw === correctPw) {
                    stampedState[currentSelectIndex] = true;
                    localStorage.setItem('teacher_stamp_state', JSON.stringify(stampedState));
                    AudioFX.playStamp();
                    closePwModal();
                    renderCards();

                    // 完成全拼圖慶祝
                    const count = stampedState.filter(Boolean).length;
                    if (count === zones.length) {
                        setTimeout(() => {
                            AudioFX.playVictory();
                            triggerConfetti();
                        }, 400);
                    }
                } else {
                    AudioFX.playError();
                    showToast("❌ 密碼錯誤，請重新詢問現場工作人員！");
                    document.getElementById('pw-input').value = '';
                }
            }
        }

        function updateUI() {
            const count = stampedState.filter(Boolean).length;
            const total = zones.length;

            const fill = document.getElementById('progress-fill');
            const text = document.getElementById('progress-text');
            const btn = document.getElementById('redeem-btn');

            fill.style.width = `${(count / total) * 100}%`;
            text.innerText = `${count} / ${total}`;

            if (isRedeemed) {
                btn.className = "redeem-btn redeemed";
                btn.innerHTML = "✅ 已完成兌換";
                btn.removeAttribute('disabled');
            } else if (count === total) {
                btn.className = "redeem-btn active";
                btn.innerHTML = "🎁 兌換好禮";
                btn.removeAttribute('disabled');
            } else {
                btn.className = "redeem-btn";
                btn.innerHTML = "🎁 兌換好禮";
                btn.setAttribute('disabled', 'true');
            }
        }

        function openRedeemModal() {
            const btn = document.getElementById('redeem-btn');
            if (btn.classList.contains('active') || btn.classList.contains('redeemed')) {
                const voucher = document.getElementById('gift-voucher');
                const staffBtn = document.getElementById('staff-redeem-btn');
                const title = document.getElementById('redeem-modal-title');
                const desc = document.getElementById('redeem-modal-desc');

                if (isRedeemed) {
                    voucher.classList.add('is-redeemed');
                    staffBtn.style.display = 'none';
                    title.innerText = "已完成獎品兌換！";
                    desc.innerText = "感謝您的熱情參與，祝您教學愉快！";
                } else {
                    voucher.classList.remove('is-redeemed');
                    staffBtn.style.display = 'block';
                    title.innerText = "恭喜完成全區體驗！";
                    desc.innerText = "請向服務台出示此兌換卡領取精美好禮！";
                }

                document.getElementById('redeem-modal').classList.add('active');
            }
        }

        function closeRedeemModal() {
            document.getElementById('redeem-modal').classList.remove('active');
        }

        function openResetModal() {
            document.getElementById('reset-modal').classList.add('active');
        }

        function closeResetModal() {
            document.getElementById('reset-modal').classList.remove('active');
        }

        function confirmResetStamps() {
            localStorage.removeItem('teacher_stamp_state');
            localStorage.removeItem('teacher_prize_redeemed');
            stampedState = new Array(zones.length).fill(false);
            isRedeemed = false;
            closeResetModal();
            renderCards();
        }

        document.getElementById('pw-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                verifyPassword();
            }
        });

        renderCards();
    </script>
</body>
</html>
